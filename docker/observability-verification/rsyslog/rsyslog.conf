# Fase 10 (SPEC.md §12) verification receiver — the "Central Log Server" from SPEC's
# architecture table, real rsyslog, not a stub. rsyslog listens on nothing by default; imudp +
# an explicit input() are required to actually receive anything (confirmed empirically, not
# assumed — the same lesson Fase 9's Pebble config needed).
module(load="imudp")
input(type="imudp" port="514")

*.* action(type="omfile" file="/var/log/messages")
