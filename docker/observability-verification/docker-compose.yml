# End-to-end verification harness for Fase 10 (Observabilidade, SPEC.md §12). Neither an
# extension of agent/tests/integration/ (agent-only, a throwaway migrate container is enough
# there) nor a reuse of docker/acme-verification/ (Pebble-specific) — this phase needs the same
# real control-plane app agent/tests/integration/ never needed (for the new replicas:sync-metrics
# command + GET /api/replicas), plus a real syslog receiver neither existing harness has. No
# queue-worker here — nothing in this phase is queued (unlike Fase 9's ACME issuance).
# See README.md in this directory for the full manual walkthrough this automates.

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: apy_gateway
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  backend:
    image: python:3-alpine
    command: sh -c "echo 'hello from observability-verification backend' > /tmp/index.html && cd /tmp && python3 -m http.server 80"

  # Real rsyslog receiver — the "Central Log Server" from SPEC's architecture table, not a stub
  # listener. rsyslog listens on nothing by default; the mounted config's imudp/input() directives
  # are what actually make it receive anything (confirmed empirically, see rsyslog/rsyslog.conf).
  rsyslog:
    image: alpine:3
    command: sh -c "apk add --no-cache rsyslog >/dev/null 2>&1 && rsyslogd -n"
    volumes:
      - ./rsyslog/rsyslog.conf:/etc/rsyslog.conf:ro

  agent:
    build:
      context: ../..
      dockerfile: nginx/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: apy_gateway
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_SSL_MODE: disabled
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_BUCKET: apy-gateway-certs
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://redis:6379/
      HEARTBEAT_INTERVAL_SECS: "5"
      HEARTBEAT_TTL_SECS: "20"
      RECONCILIATION_INTERVAL_SECS: "15"
      AGENT_HOSTNAME: observability-verification-replica
      RUST_LOG: info
      # Fase 10's own flag — this harness exists specifically to prove this path for real.
      LOG_FORWARDING_ENABLED: "true"
      CENTRAL_LOG_SERVER_HOST: rsyslog
      CENTRAL_LOG_SERVER_PORT: "514"
    ports:
      - "18080:80"
      - "18443:443"

  # No apps/control-plane/Dockerfile exists yet (Fase 11's job) — same throwaway
  # php:8.3-cli + volume-mount pattern as docker/acme-verification/docker-compose.yml.
  control-plane:
    image: php:8.3-cli
    working_dir: /app
    volumes:
      - ../../apps/control-plane:/app
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:8vRgXKZ3xY7wJ9qN2mP5tL0cF4hB6nS1eD8aG3iU7oQ=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: apy_gateway
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: apy-gateway-certs
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_FORCE_PATH_STYLE: "true"
      MINIO_SSE_ENABLED: "false"
      MAIL_MAILER: log
      SESSION_DRIVER: array
      CACHE_STORE: array
    command: >
      bash -c "
        docker-php-ext-install -j$(nproc) pdo_mysql >/dev/null &&
        php artisan migrate --force &&
        php -S 0.0.0.0:8000 -t public
      "
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 3s
      retries: 60
      start_period: 60s
