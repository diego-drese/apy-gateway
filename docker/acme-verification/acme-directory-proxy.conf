# rogierw/rw-acme-client always requests "{base_url}/directory" (matching Let's Encrypt's real
# path) — Pebble's own directory endpoint is at "/dir" instead (confirmed empirically: Pebble's
# own startup log advertises ".../dir", and a direct curl against ".../directory" 404s). This
# tiny proxy is the only fix needed: it rewrites just that one path. Every subsequent ACME request
# (nonce, account, order, finalize, cert download) goes straight from control-plane to Pebble —
# Pebble's own directory response body already reports fully-qualified "https://pebble:14000/..."
# URLs (reflecting whatever Host this proxy forwards), so nothing else needs rewriting.
server {
    listen 8080;

    location = /directory {
        proxy_pass https://pebble:14000/dir;
        proxy_ssl_trusted_certificate /etc/nginx/pebble.minica.pem;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host pebble:14000;
    }
}
