# Serves ACME HTTP-01 challenge responses the agent materializes as static files (see
# agent/src/acme_challenges.rs). No reload is needed when a file appears/disappears here —
# `alias` reads the directory live on every request.
#
# All domains share this one directory; that is not a vulnerability (SPEC.md §11): the ACME
# server always validates by dialing the specific domain it's authorizing, so one domain being
# able to see another's pending token doesn't let anyone obtain a certificate they don't
# control. This is the same pattern used by any shared-webroot ACME setup.
location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    alias /var/lib/apy-agent/acme-challenges/;
}
