user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    # Fase 10 (SPEC.md §12): error_log/access_log destination — agent-*generated* at boot
    # (agent/src/logging_config.rs), unlike the other snippets in this directory (ssl-common.conf,
    # security-headers.conf, websocket.conf, acme-challenge.conf), which are static repo files
    # baked into the image by nginx/Dockerfile. This one doesn't exist until the agent writes it.
    include /etc/nginx/snippets/logging.conf;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # The default bucket (32/64 bytes, CPU-dependent) makes `nginx -t` fail with "could not build
    # server_names_hash" as soon as one long domain name is added — with dozens of domains that is
    # a matter of time, and it would block every config change on the replica.
    server_names_hash_bucket_size 128;

    # Parity with Nginx Proxy Manager's defaults, which every proxied app migrated from it already
    # relies on: Nginx's stock 1m body limit and 60s proxy timeouts would break uploads and slow
    # endpoints that work today. Adjust here (and rebuild the image) if a lower ceiling is wanted.
    client_max_body_size  2000m;
    proxy_connect_timeout 90s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # Always-bound catch-all on :80 so Nginx can start and become "ready" even with zero
    # agent-rendered domains (e.g. a fresh install, empty proxy_hosts).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Catch-all on :443. Without it, a TLS client asking for an unknown SNI name (or an IP) would
    # be served whichever domain's certificate Nginx happens to load first — leaking that domain
    # and producing a confusing name-mismatch error. Rejecting the handshake needs no certificate.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # One file per proxy_host, agent-rendered, never hand-edited (SPEC.md §10).
    include /etc/nginx/conf.d/*.conf;
}
