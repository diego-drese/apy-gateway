user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Always-bound catch-all on :80 so Nginx can start and become "ready" even with zero
    # agent-rendered domains (e.g. a fresh install, empty proxy_hosts).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # One file per proxy_host, agent-rendered, never hand-edited (SPEC.md §10).
    include /etc/nginx/conf.d/*.conf;
}
