[package]
name = "apy-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "apy-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "tls-rustls"] }
tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = "1"
aws-config = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rustls = { version = "0.23", features = ["ring"] }
redis = { version = "0.27", features = ["tokio-comp"] }
futures-util = "0.3"
